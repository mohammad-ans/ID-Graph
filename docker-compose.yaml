version: "3.8"

services:
    metad:
        image: vesoft/nebula-metad:v3.6.0
        command:
            - --meta_server_addrs=metad:9559
            - --local_ip=metad
            - --ws_ip=metad
            - --port=9559
            - --data_path=/data/meta
        ports: ["9559:9559"]
        volumes: ["metad-data:/data/meta"]
    storaged:
        image: vesoft/nebula-storaged:v3.6.0
        command:
            - --meta_server_addrs=metad:9559
            - --local_ip=storaged
            - --ws_ip=storaged
            - --port=9779
            - --data_path=/data/storage
        ports: ["9779:9779"]
        volumes: ["storaged-data:/data/storage"]
    
    graphd:
        image: vesoft/nebula-graphd:v3.6.0
        command:
            - --meta_server_addrs=metad:9559
            - --local_ip=graphd
            - --ws_ip=graphd
            - --port=9669
        ports: ["9669:9669"]
        depends_on: [metad, storaged]
    
    postgres:
        image: postgres:16
        environment:
            POSTGRES_DB: audience
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
        ports: ["5433:5432"]
        volumes: ["pg-data:/var/lib/postgresql/data"]
    
    studio:
        image: vesoft/nebula-graph-studio:latest
        ports: ["7001:7001"]
        depends_on: [graphd]
    
    pgAdmin:
        image: dpage/pgadmin4:latest
        container_name: rampid-pgadmin
        environment:
            PGADMIN_DEFAULT_EMAIL: admin@rampid.com
            PGADMIN_DEFAULT_PASSWORD: admin
        ports: ["127.0.0.1:5050:80"]
        depends_on: [postgres]

volumes:
    metad-data:
    storaged-data:
    pg-data: