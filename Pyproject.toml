[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "identityresolver"
version = "0.2.0"
description = "Deterministic and probabilistic identity resolution over Nebula Graph"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "M. Ans", email = "ansmuhammad340@gmail.com"},
]
keywords = ["identity-resolution", "nebula-graph", "identity-graph", "audience-graph", "record-linkage"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "psycopg2-binary>=2.9",
    "PyYAML>=6.0",
    "nebula3-python>=3.4",
    "numpy>=1.24",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "build>=1.0",
    "twine>=5.0",
]

[project.urls]
Homepage = "https://github.com/mohammad-ans/ID-Graph"
Repository = "https://github.com/mohammad-ans/ID-Graph"
Issues = "https://github.com/mohammad-ans/ID-Graph/issues"

[project.scripts]
identityresolver = "identityresolver.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"identityresolver.presets" = ["*.yaml", "*.ngql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
