identifiers:
 - name: email
   column: hashed_email
   pre_hashed: true
   edge_tag: has_email
   include_in_belongs_to: true
 - name: phone
   column: hashed_phone
   pre_hashed: true
   edge_tag: has_phone
   include_in_belongs_to: true
 - name: maid
   column: maid
   pre_hashed: false
   edge_tag: has_maid
   include_in_belongs_to: false

signal_groups:
 - name: device_props
   columns: [screen_width, screen_length]
   edge_tag: has_device
 - name: ip_loc
   columns: [ip_country, city, language]
   edge_tag: has_ip

passthrough:
 - transaction_date
 - merchant_name
 - merchant_url
 - source_table

record_id:
  - record_id

field_roles:
  temporal:
    source: attributes
    column: transaction_date
  behavioral:
    source: attributes
    column: merchant_name
  blocking_geo:
    source: raw_signals
    column: ip_country
    
resolver:
 - probabilistic: true
probabilistic:
  - auto_merge_threshold: 0.9
  - review_threshold: 0.8
  - active_learning_min_labels: 15
  - fields:
      screen_width: {m: 0.85, u: 0.15}
      screen_length: {m: 0.85, u: 0.15}
      ip_country: {m: 0.9, u: 0.35}
      city: {m: 0.75, u: 0.08}
      language: {m: 0.9, u: 0.45}
      temporal_same_day: {m: 0.5, u: 0.03}
      temporal_same_week: {m: 0.7, u: 0.12}
      temporal_same_month: {m: 0.85, u: 0.35}
      merchant_name: {m: 0.4, u: 0.15}